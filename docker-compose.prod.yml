# Capa 2 (DEPLOY_VPS_PLAN.md): production-grade compose stack.
#
# Boundaries:
#   - postgres + backend + frontend live on an internal bridge network.
#   - Only :80/:443 should ever be published — Capa 3 introduces Caddy and
#     removes the temporary frontend/backend host ports added here for
#     smoke testing.
#   - postgres has NO `ports:` block. Reachable only through the internal
#     network from `backend` and `release`.
#
# Lifecycle:
#   1. postgres comes up first; healthcheck waits for pg_isready.
#   2. release one-shot runs migrate + collectstatic + seed_permissions,
#      writes static assets into the `static_files` named volume, exits 0.
#   3. backend (gunicorn) starts ONLY after release exits successfully.
#   4. frontend (nginx + dist bundle) starts independently.
#
# Idempotency: release is `restart: "no"` and depends on
# `service_completed_successfully`. Re-running `docker compose up -d`
# only re-runs release if its image/source changed.

name: vet

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Capa 4 will switch this to a bind-mount on the VPS
      # (`/var/lib/vet/pgdata:/var/lib/postgresql/data`) so backups + restores
      # touch a known host path. Named volume during local dev for portability.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M
    networks: [internal]
    # NO ports: — accessed only via the internal network.

  # P1-1 (ADR p41): shared cache + DRF throttle store across gunicorn workers.
  # Ephemeral by design — holds ONLY a 30s dashboard cache + login throttle
  # counters, nothing authoritative. No persistence, no volume: a restart loses
  # at most that cache + in-flight counters (both reconstructed on next use).
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    environment:
      # The official redis image does NOT auto-read this — auth is set by
      # --requirepass below. It's here so the healthcheck (and any exec-in)
      # can authenticate without baking the secret into the compose file.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - "exec redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""
    healthcheck:
      # Authenticated PING: also proves requirepass is enforced (an
      # unauthenticated PING returns NOAUTH and fails the grep).
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 320M
    networks: [internal]
    # NO ports: — internal network only, like postgres.

  release:
    build: *backend-build
    # P1-6B: SHA-tagged for pointer rollback. deploy.sh exports IMAGE_TAG=<sha>
    # at build + up; rollback.sh flips it to a previous tag (no rebuild). Default
    # `latest` keeps a bare `docker compose up` working for the first manual boot.
    image: vet-backend:${IMAGE_TAG:-latest}
    env_file: .env.prod
    command: ["/app/scripts/release.sh"]
    # Intentionally NOT depends_on redis: release runs migrate / collectstatic
    # / seed_permissions, none of which touch the Django cache. Keep it that
    # way — any release-time command that reads caches['throttle_login'] would
    # fail-closed against a not-yet-ready Redis (P1-1 / ADR p41).
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    volumes:
      - static_files:/app/staticfiles

  backend:
    build: *backend-build
    # P1-6B: SHA-tagged for pointer rollback. deploy.sh exports IMAGE_TAG=<sha>
    # at build + up; rollback.sh flips it to a previous tag (no rebuild). Default
    # `latest` keeps a bare `docker compose up` working for the first manual boot.
    image: vet-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-3}
      - --threads=${GUNICORN_THREADS:-2}
      - --timeout=${GUNICORN_TIMEOUT:-60}
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
      - --log-level=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    healthcheck:
      # Stdlib only — keeps the runtime image free of curl-as-dep noise.
      # ALLOWED_HOSTS must include `localhost` (.env.prod.example documents).
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://localhost:8000/api/healthz/', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - static_files:/app/staticfiles
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal]
    # Capa 3: NO host port mapping. Caddy proxies /api/* → backend:8000
    # over the internal network. Backend is unreachable from outside.

  # É-F0 PR-8: worker del agente conversacional (runbook:
  # docs/runbooks/agent-whatsapp.md). Misma imagen SHA-tagged que backend;
  # B4: planner y sender del outbox en procesos independientes.
  # Stateless: N réplicas conviven sin coordinación (FOR UPDATE SKIP LOCKED).
  # Sin healthcheck de contenedor: `restart` cubre crashes y el deadman de
  # Healthchecks.io (HEALTHCHECK_AGENT_WORKER_URL) detecta un loop colgado.
  # Sin depends_on redis: el worker no toca la cache (mismo razonamiento que
  # `release`).
  worker:
    build: *backend-build
    image: vet-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    command: ["python", "manage.py", "run_agent_worker", "--mode", "planner", "--poll", "1", "--batch", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    networks: [internal]
    deploy:
      # B9 PROFILE-BETA-1: two sequential planners; never autoscale this
      # topology without a new measured contract. DB claim also caps each org.
      replicas: 2
      resources:
        limits:
          memory: 256M

  sender:
    build: *backend-build
    image: vet-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    command: ["python", "manage.py", "run_agent_worker", "--mode", "sender", "--poll", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        # P1-5: tags de Sentry browser + upload de source maps (build-time).
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      # BuildKit secret, not a build arg: it must not persist in the build history
      # or cache of the host. Declared at the bottom of this file.
      secrets:
        - sentry_auth_token
    image: vet-frontend:${IMAGE_TAG:-latest}   # P1-6B: SHA-tagged (see backend note)
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M
    # Capa 3: NO host port mapping. Caddy proxies / → frontend:80.

  caddy:
    image: caddy:2-alpine@sha256:70b3180738b46cd88e49b300d790ae448a0aca3f58edef0f000bb57d619a9ab3
    restart: unless-stopped
    ports:
      # The ONLY ports exposed to the world. Everything else is internal.
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
      # Slug secreto del Django admin. Caddy enruta /{$DJANGO_ADMIN_URL}* al
      # backend; el backend lee la MISMA var (env_file .env.prod) para montar
      # admin.site.urls bajo ese slug. Sin setear → Caddy cae a __admin_disabled__
      # (fail-closed) y /admin literal responde 404. NO debe empezar con 'admin'.
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-__admin_disabled__}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # ACME account + issued certs (PERSIST or you re-issue every restart and hit LE rate limits)
      - caddy_config:/config
      - static_files:/srv/static:ro  # Django collectstatic output, RO
      # Temporary beta deployment — landing served from a SEPARATE repo
      # (SaaSVet-Landing); to be decoupled in a future infra migration. See docs/deuda C8.
      - /home/deploy/apps/SaaSVet-Landing/frontend/dist:/srv/landing:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      # Liveness probe against the INTERNAL http://localhost:8081 health
      # listener defined in infra/Caddyfile — plain HTTP, no TLS, no redirect.
      # Do NOT point this at :80/:443: the public {$DOMAIN} block forces
      # HTTP→HTTPS and its cert is for the domain, not `localhost`, so a
      # loopback probe there is flagged `unhealthy` (busybox wget has no
      # reliable TLS either). Port 8081 is not published → internet can't reach
      # it. See the Caddyfile block for the full rationale.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/api/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  static_files:
  caddy_data:
  caddy_config:

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
