# P1-3 — gitleaks config for the CI secret scan (.github/workflows/ci.yml).
# Extends the full default ruleset; only adds an allowlist for files that
# legitimately contain NO real secrets, so the BLOCKING gate never false-fails
# on templates or generated lockfiles.
title = "VetCare CI secret scan"

[extend]
useDefault = true

[allowlist]
description = "Templates, generated lockfiles, and documented example secrets (no real secrets)"
paths = [
  '''\.env\.prod\.example$''',
  '''pnpm-lock\.yaml$''',
  '''requirements\.lock$''',
  # Test de rotación del token de WhatsApp: solo contiene valores DUMMY
  # ("dummy-…") por diseño; el rule generic-api-key matchea la clave
  # `"token": "…"` sin importar el valor. Sin secretos reales.
  '''backend/apps/channels/tests/test_token\.py$''',
]
# Surgical exemption for ONE documented example value: the illustrative
# `temp_password` in the ADR p21 sample HTTP response
# (docs/decisions/2026-05-22-p21-admin-password-reset.md). It is a made-up
# example, never a real credential. Allowlisting the exact string keeps the
# generic-api-key rule fully active for everything else — including any other
# high-entropy value in that same file.
regexes = [
  '''K9p_RxA2zVtwQ1f8hQwa3Q''',
]
