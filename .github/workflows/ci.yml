name: CI

# P1-3 — Continuous Integration only (NOT CD). Protects develop/main by
# running backend tests + migration checks, frontend build, and a secret scan
# on every push/PR. No deploy, no Docker registry, no VPS, no coverage gates.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Least privilege: CI only reads the repo. It never writes or deploys.
permissions:
  contents: read

# Cancel superseded runs on the same ref → faster feedback, fewer minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA, with the tag as a comment. To bump:
#   gh api repos/<owner>/<action>/commits/<tag> --jq .sha
# and review that release first: a pasted SHA proves nothing about what it contains.
jobs:
  # ---------------------------------------------------------------------------
  # BACKEND (required) — Postgres 16 service, migration drift check, full suite.
  # Tests need NO Redis: ENVIRONMENT=dev falls back to LocMem cache (ADR p41).
  # ---------------------------------------------------------------------------
  backend:
    name: backend (tests + migrations)
    # Pinned, not ubuntu-latest: the media restore drill runs the runner's
    # pg_dump/pg_restore against the postgres:16 service (same major as prod).
    # ubuntu-26.04 ships a newer client whose dumps emit
    # `SET transaction_timeout`, which PostgreSQL 16 rejects. Bump this together
    # with the service image and docker-compose.prod.yml.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Wait for Postgres before the steps run (avoids flaky connect races).
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy, NON-secret CI values. SECRET_KEY has no default in settings.py,
      # so it must be provided or Django refuses to start.
      SECRET_KEY: ci-not-a-real-secret
      ENVIRONMENT: dev
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: config.ci
      CI_TEST_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies (pinned lockfile)
        run: pip install -r requirements.lock
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --no-input
      - name: Verify Billing model/state/physical schema contract
        run: python manage.py audit_billing_schema --json
      - name: B0 critical corpus (required, no skips)
        run: >-
          python manage.py test apps.agent.tests.test_b0_containment
          --testrunner apps.agent.tests.harness.CriticalB0Runner
      - name: B3 durable work and independent PostgreSQL processes (required)
        run: >-
          python manage.py test apps.agent.tests.test_b3_durable
          apps.agent.tests.test_b3_processes
          --testrunner apps.agent.tests.harness.CriticalB3Runner
      - name: B4 durable sender and external uncertainty (required)
        run: >-
          python manage.py test apps.agent.tests.test_b4_sender
          apps.agent.tests.test_b4_processes apps.agent.tests.test_b4_command
          apps.channels.tests.test_b4_transport apps.channels.tests.test_b4_webhook
          apps.channels.tests.test_b4_migration
          --testrunner apps.agent.tests.harness.CriticalB4Runner
      - name: B5 contextual safety and durable handoff (required)
        run: >-
          python manage.py test apps.agent.tests.test_b5_corpus
          apps.agent.tests.test_b5_safety apps.agent.tests.test_b5_processes
          apps.agent.tests.test_b5_migration
          --testrunner apps.agent.tests.harness.CriticalB5Runner
      - name: Run test suite (parallel)
        run: python manage.py test --parallel

  # ---------------------------------------------------------------------------
  # FRONTEND (required) — build + unit tests (Vitest) must pass; lint advisory.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (build + test + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy, NO secreto. src/api/client.js valida VITE_API_URL a nivel módulo
      # (throw si falta); los tests que importan páginas/API transitivamente
      # ejecutan ese módulo bajo Vitest. Sin esto, 3 test files fallan al
      # importar aunque los 247 tests pasen (rojo desde f6c2321).
      VITE_API_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm must be installed before setup-node so its pnpm cache works.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (blocking)
        run: pnpm run build
      - name: Unit tests — Vitest (blocking)
        run: pnpm run test
      - name: Lint (warning)
        continue-on-error: true
        run: pnpm run lint
      - name: Smoke - URL construction (blocking)
        run: pnpm run smoke:urls

  # ---------------------------------------------------------------------------
  # IMAGES: real builds, since the Dockerfiles are not exercised anywhere else.
  # A canary proves the Sentry token reaches the build but no layer or history of
  # any stage. It cannot prove the upload to Sentry: that needs real credentials.
  # ---------------------------------------------------------------------------
  images:
    name: images (build + build secret)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image
        run: docker build --target runtime -t vet-backend:ci backend
      - name: Build frontend with a canary token
        env:
          SENTRY_AUTH_TOKEN: canary-sentry-token-3f9c1a7e
        run: |
          set -euo pipefail
          for target in builder runtime; do
            DOCKER_BUILDKIT=1 docker build --no-cache --progress=plain \
              --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
              --build-arg VITE_API_URL=https://ci.invalid/api/ \
              --target "$target" -t "vet-frontend:$target" frontend 2>&1 | tee "/tmp/build-$target.log"
            grep -q '\[build\] sentry token: provided' "/tmp/build-$target.log" || [ "$target" = runtime ]
          done
      - name: The canary is in no layer or history of any stage
        run: |
          set -euo pipefail
          canary=canary-sentry-token-3f9c1a7e
          for target in builder runtime; do
            if docker history --no-trunc "vet-frontend:$target" | grep -q "$canary"; then
              echo "::error::token found in the history of $target"; exit 1
            fi
            if docker inspect "vet-frontend:$target" | grep -q "$canary"; then
              echo "::error::token found in the config of $target"; exit 1
            fi
            docker save "vet-frontend:$target" -o "/tmp/$target.tar"
            mkdir -p "/tmp/layers-$target"
            tar -xf "/tmp/$target.tar" -C "/tmp/layers-$target"
            if grep -rqa "$canary" "/tmp/layers-$target"; then
              echo "::error::token found in the layers of $target"; exit 1
            fi
          done
      - name: A build without the token still works and says so
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --no-cache --progress=plain \
            --build-arg VITE_API_URL=https://ci.invalid/api/ \
            --target builder -t vet-frontend:no-secret frontend 2>&1 | tee /tmp/build-no-secret.log
          grep -q '\[build\] sentry token: absent' /tmp/build-no-secret.log
      - name: The compose file builds the frontend with the secret
        env:
          SENTRY_AUTH_TOKEN: canary-sentry-token-3f9c1a7e
          VITE_API_URL: https://ci.invalid/api/
        run: |
          set -euo pipefail
          # The services declare env_file: .env.prod, so compose needs it to exist.
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.prod build frontend
      - name: The compose file builds the frontend when the token is empty
        env:
          VITE_API_URL: https://ci.invalid/api/
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml --env-file .env.prod build --no-cache frontend

  # ---------------------------------------------------------------------------
  # SECURITY — gitleaks is BLOCKING (a prior accidental B2 credential exposure
  # is why secrets must never enter the repo). Dependency audits are advisory.
  # ---------------------------------------------------------------------------
  security:
    name: security (gitleaks blocking; audits warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits
      - name: gitleaks secret scan (BLOCKING)
        env:
          GITLEAKS_VERSION: 8.18.4
          # From gitleaks_8.18.4_checksums.txt in the upstream GitHub release. To bump:
          # take the new value from that file, never from a local download of the binary.
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Downloading gitleaks ${GITLEAKS_VERSION}: ${url}"
          # -f: fail (non-zero) on HTTP errors instead of saving a 404 page;
          # --retry: survive transient network/registry blips. Without -f a bad
          # download would only surface later as an opaque tar/exec failure.
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo "Using gitleaks version: $(/tmp/gitleaks version)"
          # --redact keeps secret VALUES out of the log AND the report, so the
          # report is safe to print for diagnosis. Capture the exit code so a
          # red gate is never left without a visible reason.
          set +e
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::gitleaks failed (exit ${code}). Redacted report below (empty/absent => a gitleaks run error, not a finding):"
            cat /tmp/gitleaks-report.json 2>/dev/null || echo "(no report file produced)"
            exit "$code"
          fi
          echo "gitleaks: no leaks found."
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: pip-audit (warning)
        continue-on-error: true
        run: |
          # Pins the tool only; its transitive dependencies still float. It runs
          # with no secrets and is advisory, so a full lockfile is not justified.
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: pnpm audit (warning)
        continue-on-error: true
        working-directory: frontend
        # Full tree (not --prod): surface build/dev-dep advisories too. Advisory
        # only — continue-on-error keeps it non-blocking.
        run: pnpm audit
