# Capa 1 (DEPLOY_VPS_PLAN.md): nginx config baked into the frontend image.
# This nginx ONLY serves the static SPA bundle on :80 inside the internal
# docker network. The PUBLIC reverse proxy (Caddy, Capa 3) terminates TLS
# and forwards / → frontend:80, /api/* → backend:8000.
#
# Do NOT add API proxy_pass here — that's Caddy's job. Keep this file
# single-purpose: static + SPA fallback.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version.
    server_tokens off;

    # SPA fallback: any unknown route → index.html so react-router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are content-addressed by Vite — safe to cache forever.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NEVER be cached aggressively — it's the entry point
    # that references the hashed asset filenames. Cache it and stale clients
    # will request asset names that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Block dotfiles defensively (no .git, .env, etc. should reach here,
    # but cheap insurance).
    location ~ /\. {
        deny all;
    }
}
