<svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flecha de conexión">
  <!-- Flecha horizontal base. Para otras direcciones rotar el <svg> o el <g>:
       abajo => rotate(90), arriba => rotate(-90), izquierda => rotate(180). -->
  <g id="arrow" stroke="currentColor" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line id="arrowShaft" x1="8" y1="20" x2="104" y2="20"/>
    <polyline id="arrowHead" points="90,8 108,20 90,32"/>
  </g>
</svg>
