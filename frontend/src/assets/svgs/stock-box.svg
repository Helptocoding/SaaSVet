<svg viewBox="0 0 360 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contenedor de stock compartido">
  <!-- ===== SOMBRA DE LA TARJETA ===== -->
  <g id="cardShadow">
    <rect x="24" y="20" width="312" height="180" rx="16"
      fill="var(--stock-shadow, #1E3A6B)" opacity="0.12"/>
  </g>

  <!-- ===== CUERPO DE LA TARJETA ===== -->
  <g id="cardBody">
    <rect x="18" y="14" width="324" height="180" rx="16"
      fill="var(--stock-body, #FFFFFF)"/>
    <rect x="18" y="14" width="324" height="180" rx="16"
      fill="none" stroke="var(--stock-line, #D8E3F5)" stroke-width="1.5"/>
  </g>

  <!-- ===== HEADER (banda navy) ===== -->
  <g id="header">
    <path d="M18 30 a16 16 0 0 1 16 -16 h292 a16 16 0 0 1 16 16 v34 h-324 Z"
      fill="var(--stock-header, #1E3A6B)"/>
    <!-- icono de cubitos -->
    <g id="headerIcon" fill="#FFFFFF" opacity="0.95">
      <rect x="42" y="32" width="11" height="11" rx="1.5"/>
      <rect x="55" y="32" width="11" height="11" rx="1.5" opacity="0.7"/>
      <rect x="48" y="44" width="11" height="11" rx="1.5" opacity="0.85"/>
    </g>
    <!-- placeholder texto "STOCK COMPARTIDO" -->
    <rect id="text-header" x="76" y="33" width="150" height="14" rx="3"
      fill="#FFFFFF" opacity="0.22"/>
  </g>

  <!-- ===== PLACEHOLDERS DEL CUERPO ===== -->
  <g id="textPlaceholders">
    <!-- "Total en inventario" -->
    <rect id="text-label" x="120" y="86" width="120" height="10" rx="3"
      fill="var(--stock-line, #D8E3F5)"/>
    <!-- "150 piezas" (cifra grande) -->
    <rect id="text-total" x="108" y="104" width="144" height="32" rx="5"
      fill="var(--stock-accent, #2B5BA8)" opacity="0.18"/>
    <!-- línea de equivalencia 1 -->
    <rect id="text-eq1" x="80" y="150" width="200" height="9" rx="3"
      fill="var(--stock-line, #D8E3F5)"/>
    <!-- línea de equivalencia 2 -->
    <rect id="text-eq2" x="100" y="166" width="160" height="9" rx="3"
      fill="var(--stock-line, #D8E3F5)"/>
  </g>
</svg>
